name: DevSecOps Security Pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      severity:
        description: 'Severidades que devem falhar o build (Trivy)'
        required: false
        default: 'CRITICAL,HIGH'
        type: string

jobs:
  sast-scan:
    name: Análise Estática de Código (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
      - name: Executar Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

  container-scan:
    name: Varredura de Imagem Docker (Trivy)
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
      - name: Build da Imagem Docker
        run: docker build -t secops-demo-api:latest ./app
      - name: Executar Varredura com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secops-demo-api:latest'
          exit-code: '1'
          severity: ${{ inputs.severity || 'CRITICAL,HIGH' }}

  publish:
    name: Publicar Imagem no GHCR
    runs-on: ubuntu-latest
    needs: container-scan
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/secops-demo-api:latest