name: DevSecOps Security Pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      severity:
        description: 'Severidades que devem falhar o build (Trivy)'
        required: false
        default: 'CRITICAL,HIGH'
        type: string
jobs:
  sast-scan:
    name: Análise Estática de Código (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
      - name: Executar Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

  container-scan:
    name: Varredura de Imagem Docker (Trivy)
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
      - name: Build da Imagem Docker
        run: docker build -t secops-demo-api:latest ./app
      - name: Executar Varredura com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secops-demo-api:latest'
          exit-code: '1'
          severity: ${{ inputs.severity || 'CRITICAL,HIGH' }}

  dast-scan:
    name: Varredura Dinâmica da API (DAST - OWASP ZAP)
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
      - name: Build da Imagem Docker
        run: docker build -t secops-demo-api:test ./app
      - name: Subir o Container
        run: |
          docker run -d --name api-test -p 5000:5000 secops-demo-api:test
          for i in {1..10}; do
            curl -sf http://localhost:5000/ && break
            echo "Aguardando API subir... tentativa $i"
            sleep 3
          done
      - name: Executar ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true   # bug conhecido no upload interno da action (artefato zap_scan); nosso próprio upload abaixo cobre os relatórios
        with:
          target: 'http://localhost:5000'
          fail_action: false        # não quebra o pipeline por WARN (só relata)
          allow_issue_writing: false # não tenta criar issue automática (GITHUB_TOKEN não tem permissão)
          cmd_options: '-a'
      - name: Publicar relatório do ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
      - name: Parar o Container
        if: always()
        run: docker rm -f api-test

  publish:
    name: Publicar Imagem no GHCR
    runs-on: ubuntu-latest
    needs: [container-scan, dast-scan]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/secops-demo-api:latest